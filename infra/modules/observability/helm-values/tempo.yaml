tempo:
  retention: ${tempo_retention}
  storage:
    trace:
      backend: s3
      s3:
        bucket: ${tempo_bucket}
        region: ${aws_region}
        endpoint: s3.${aws_region}.amazonaws.com
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

persistence:
  enabled: false

service:
  type: ClusterIP
