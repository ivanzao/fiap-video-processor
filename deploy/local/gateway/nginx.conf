# Substituto local do API Gateway. Só roteia: /auth/ vai para o cmd/local do auth e o resto
# para a api, que também serve a página web. Não valida o JWT nem injeta X-User-Id e
# X-User-Email; localmente a página e o e2e mandam esses headers decodificados do próprio token.
# client_max_body_size 0 porque o upload vai direto ao LocalStack e não passa por aqui.
server {
    listen 8080;
    client_max_body_size 0;
    resolver 127.0.0.11 valid=10s;

    location /auth/ {
        set $auth_upstream http://auth:8081;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
    }

    location / {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }
}
