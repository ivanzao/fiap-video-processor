name: Service image

on:
  workflow_call:
    inputs:
      service:
        description: Service directory name under services/
        required: true
        type: string
      image:
        description: Image name under ghcr.io/<owner>/
        required: true
        type: string
      target:
        description: Dockerfile target to build
        required: false
        type: string
        default: ""
      build_args:
        description: Newline-separated build args
        required: false
        type: string
        default: ""
      platforms:
        description: Target platforms
        required: false
        type: string
        default: linux/amd64
    outputs:
      image_tag:
        description: Tag pushed to GHCR (sha-<short>)
        value: ${{ jobs.build.outputs.image_tag }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,priority=50

      - uses: docker/setup-qemu-action@v3
        if: inputs.platforms != 'linux/amd64'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build_args }}
          platforms: ${{ inputs.platforms }}
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
