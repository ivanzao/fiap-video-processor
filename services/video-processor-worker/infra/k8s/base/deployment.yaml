apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor-worker
  labels:
    app: video-processor-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-processor-worker
  template:
    metadata:
      labels:
        app: video-processor-worker
    spec:
      terminationGracePeriodSeconds: 330
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: worker
          image: ghcr.io/ivanzao/video-processor-worker:latest
          ports:
            - containerPort: 9090
              name: health
          envFrom:
            - configMapRef:
                name: video-processor-worker-config
            - secretRef:
                name: video-processor-worker-secret
          volumeMounts:
            - name: work
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 4Gi
