apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor-api
  labels:
    app: video-processor-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-processor-api
  template:
    metadata:
      labels:
        app: video-processor-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/ivanzao/video-processor-api:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: video-processor-api-config
            - secretRef:
                name: video-processor-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
