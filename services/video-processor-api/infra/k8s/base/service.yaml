apiVersion: v1
kind: Service
metadata:
  name: video-processor-api
  labels:
    app: video-processor-api
spec:
  type: NodePort
  selector:
    app: video-processor-api
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
