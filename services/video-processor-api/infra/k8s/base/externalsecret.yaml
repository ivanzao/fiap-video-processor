apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: video-processor-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: video-processor-api-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: video-processor/set-by-overlay/api/db-app
        property: url
